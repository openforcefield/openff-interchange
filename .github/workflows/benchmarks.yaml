name: Performance benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Performance benchmarks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.3

      - name: Benchmark latest commit on default branch
        run: pixi run -e main benchmark_main

      - name: Benchmark HEAD
        run: pixi run -e benchmarks benchmark_head

      - name: Compare HEAD against latest release
        run: pixi run -e benchmarks compare_benchmarks
